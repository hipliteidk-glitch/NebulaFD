name: Build Patched Linux
on:
  workflow_dispatch:
  push:
    branches: [ 2024-nebula ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Patch all Windows-only code
        run: |
          echo "Patching MFAParser..."
          sed -i 's/.*Image\.FromFile.*/            System.Drawing.Image icon = null; \/\/ PATCHED/g' Nebula.Tools/GameDumper/MFAParser.cs || true
          echo "Ensuring GameDumper.csproj is Linux-friendly"
          cat Nebula.Tools/GameDumper/GameDumper.csproj
          echo "Disable AppIcon System.Drawing heavy code for Linux"
          sed -i 's/System\.Drawing\.Image icon = Image\.FromFile/System.Drawing.Image icon = null; \/\/ PATCHED \/\/ was: System.Drawing.Image icon = Image.FromFile/g' Nebula.Core/Data/Chunks/AppChunks/AppIcon.cs || true
          sed -i 's/Image\.FromFile.*/null; \/\/ PATCHED/g' Nebula.Core/Data/Chunks/AppChunks/AppIcon.cs || true
      - name: Publish Headless
        run: |
          dotnet publish Nebula.Headless/Nebula.Headless.csproj -c Release -o ./publish -p:TreatWarningsAsErrors=false -p:WarningsNotAsErrors=CA1416
          mkdir -p ./publish/Tools/ObjectIcons
          cp -r .resources/ObjectIcons/* ./publish/Tools/ObjectIcons/ 2>/dev/null || true
          touch ./publish/Tools/ObjectIcons/MMFApplication.png
          cp .resources/ExtensionDumper.mfx ./publish/Tools/ 2>/dev/null || true
          echo '{"ignore_sounds":true,"ignore_music":true}' > ./publish/config.json
          ls -lh ./publish/
          ./publish/Nebula.Headless --help 2>&1 | head -n 20 || true
      - uses: actions/upload-artifact@v4
        with:
          name: NebulaFD-Linux-Patched
          path: publish/
