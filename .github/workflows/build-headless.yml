name: Build Headless Fixed
on:
  workflow_dispatch:
  push:
    branches: [2024-nebula]
    paths: ["Nebula.Headless/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build Nebula.Headless -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: Nebula.Headless-fixed
          path: Nebula.Headless/bin/Release/net8.0/
